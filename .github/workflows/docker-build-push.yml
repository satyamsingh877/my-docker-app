name: Build and Push Docker Image

on:
  push:
    branches: [ main ]

env:
  REGISTRY: docker.io  # Change to ghcr.io if using GitHub Container Registry

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4  # Updated from v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3  # Updated from v2

    - name: Log in to Docker Registry
      uses: docker/login-action@v3  # Updated from v2
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5  # Updated from v4
      with:
        context: .
        push: true
        # ✅ Correct tag format: include your username
        tags: ${{ secrets.DOCKER_USERNAME }}/my-app:latest